# Automated Research & Writing Flow for CrewAI
# This YAML defines the full flow, crews, agents, and tasks for the assignment.

crews:
  research_crew:
    description: Search for recent technical papers related to the given topic.
    agents:
      - searcher_agent
      - validator_agent
    tasks:
      - search_papers
      - validate_papers

  analysis_crew:
    description: Read the selected papers and extract 3–5 key insights.
    agents:
      - summarizer_agent
      - insight_extractor_agent
    tasks:
      - summarize_papers
      - extract_insights

  writing_crew:
    description: Draft a concise 600–800 word digest article.
    agents:
      - outline_creator_agent
      - writer_agent
      - proofreader_agent
    tasks:
      - create_outline
      - write_draft
      - proofread_article

agents:
  searcher_agent:
    role: Research Paper Searcher
    goal: Find 5–7 relevant research papers on the topic.
    backstory: Skilled at searching academic databases and filtering for relevance.
  validator_agent:
    role: Source Validator
    goal: Ensure selected papers are from credible sources.
    backstory: Expert in academic publishing standards and credibility assessment.
  summarizer_agent:
    role: Paper Summarizer
    goal: Create short summaries for each paper.
    backstory: Experienced in distilling complex research into concise summaries.
  insight_extractor_agent:
    role: Insight Extractor
    goal: Identify common themes and research gaps.
    backstory: Analytical thinker with a knack for finding patterns in research.
  outline_creator_agent:
    role: Article Outline Designer
    goal: Design a logical article structure.
    backstory: Skilled in organizing information for clarity and flow.
  writer_agent:
    role: Digest Writer
    goal: Expand the outline into a draft article.
    backstory: Proficient technical writer with experience in research communication.
  proofreader_agent:
    role: Article Proofreader
    goal: Check clarity, flow, and correctness.
    backstory: Detail-oriented editor ensuring high-quality output.

tasks:
  search_papers:
    description: Search for recent technical papers on the input topic.
    expected_output: List of 5–7 relevant research papers with links.
    agent: searcher_agent
  validate_papers:
    description: Validate that the selected papers are from credible sources.
    expected_output: Filtered list of credible papers.
    agent: validator_agent
  summarize_papers:
    description: Summarize each credible paper in 2–3 sentences.
    expected_output: Short summaries for each paper.
    agent: summarizer_agent
  extract_insights:
    description: Identify 3–5 key insights, common themes, and research gaps.
    expected_output: List of insights and gaps.
    agent: insight_extractor_agent
  create_outline:
    description: Create a logical outline for the digest article.
    expected_output: Article outline with sections and bullet points.
    agent: outline_creator_agent
  write_draft:
    description: Write a 600–800 word draft based on the outline and insights.
    expected_output: Draft article in markdown format.
    agent: writer_agent
  proofread_article:
    description: Review and proofread the draft for clarity, flow, and correctness.
    expected_output: Final, polished article.
    agent: proofreader_agent
